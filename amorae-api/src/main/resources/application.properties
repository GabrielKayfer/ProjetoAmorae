spring.application.name=amorae-api

# Server Config
server.port=8080

# PostgreSQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/amorae}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration (to be overridden by environment variables in Render)
jwt.secret=${JWT_SECRET:dGhpcy1pcy1hLXZlcnktc2VjdXJlLWtleS1mb3Itam10LXRva2Vucy1hbW9yYWUtYXBpLWFtb3JhZS1hcGktYW1vcmFlLWFwaQ==}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS Configuration (Set via Environment variables for Vercel deployment)
# Multiple origins can be separated by commas
cors.allowed-origins=${FRONTEND_URL:http://localhost:5173}
